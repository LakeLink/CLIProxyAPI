[package]
name = "codex-rustls-reference"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
aws-lc-rs = "=1.18.1"
aws-lc-sys = "=0.45.0"
reqwest = { version = "=0.12.28", features = ["cookies", "json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
tokio-rustls = "=0.26.4"
hyper-rustls = { version = "=0.27.7", default-features = false }

[[bin]]
name = "codex-rustls-reference"
path = "main.rs"
